{{ define "main" }}
<div class="page-header">
  <h1>Artists</h1>
</div>

<div class="search-box">
  <input type="text" class="search-input" placeholder="Search artists…">
</div>

<ul class="artist-list">
  {{ range .Pages.ByTitle }}
  <li class="artist-item" data-searchable>
    <a href="{{ .RelPermalink }}">
      <span class="artist-name">{{ .LinkTitle }}</span>
      <span class="artist-count">{{ len .Pages }} song{{ if ne (len .Pages) 1 }}s{{ end }}</span>
    </a>
  </li>
  {{ end }}
</ul>
{{ end }}
