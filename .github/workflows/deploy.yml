name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so a pull request run cannot cancel a master deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the exact Hugo and Go versions pinned in mise.toml, so CI and
      # local builds cannot drift.
      - uses: jdx/mise-action@v2

      - run: mise run build
      - run: mise run test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Pull requests build and test only — publishing stays master-only.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
